name: Build Linux

# 触发条件：
# - 推送 v* tag 时构建并上传到对应 Release
# - 手动触发（workflow_dispatch）仅构建并上传 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Flutter Linux 桌面工具链 + media_kit(libmpv) 运行时依赖
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libmpv-dev mpv

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate linux platform files
        run: |
          # 仓库未包含 linux/ 工程目录，这里按需生成
          if [ ! -d linux ]; then
            flutter create --platforms=linux .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package artifact
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | tr -d '[:space:]')
          BUNDLE_DIR=build/linux/x64/release/bundle
          OUT="NekoMusic-${VERSION}-linux-x64.tar.gz"
          tar -czf "$OUT" -C "$BUNDLE_DIR" .
          echo "ARTIFACT_PATH=$OUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$OUT" >> "$GITHUB_ENV"
          for file in "dist/NekoMusic-${VERSION}.apk" "dist/NekoMusic-${VERSION}.dmg"; do
            if [ -f "$file" ]; then
              echo "$file" >> "$GITHUB_ENV"
            fi
          done
          echo "EOF" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
